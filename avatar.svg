      <stop offset="1" stop-color="#D9DCE1"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6DB6F0"/>
      <stop offset="1" stop-color="#2F8EDB"/>
