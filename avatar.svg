      <stop offset="1" stop-color="#191C21"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9DCE1"/>
      <stop offset="0.3" stop-color="#FFFFFF"/>
